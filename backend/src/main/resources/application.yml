spring:
  application:
    name: buildease
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    url: ${MIGRATION_DB_URL}
    user: ${MIGRATION_DB_USERNAME}
    password: ${MIGRATION_DB_PASSWORD}
    baseline-on-migrate: false
    clean-disabled: true
    placeholders:
      runtimeRole: ${DB_USERNAME}
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
app:
  jwt-secret: ${JWT_SECRET}
  secure-cookies: ${SECURE_COOKIES:true}
  bootstrap-email: ${BOOTSTRAP_EMAIL:}
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}
  public-url: ${PUBLIC_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:}
  web-push-public-key: ${WEB_PUSH_PUBLIC_KEY:}
  automation-delay-ms: ${AUTOMATION_DELAY_MS:60000}
  object-storage-bucket: ${OBJECT_STORAGE_BUCKET:}
  object-storage-region: ${OBJECT_STORAGE_REGION:us-east-1}
  object-storage-endpoint: ${OBJECT_STORAGE_ENDPOINT:}
  object-storage-path-style: ${OBJECT_STORAGE_PATH_STYLE:true}
spring.mail:
  host: ${SMTP_HOST:}
  port: ${SMTP_PORT:587}
  username: ${SMTP_USERNAME:}
  password: ${SMTP_PASSWORD:}
  properties:
    mail.smtp.connectiontimeout: 5000
    mail.smtp.timeout: 3000
    mail.smtp.writetimeout: 5000
    mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}

# Keep HTTP/security/JDBC logging free of credential-bearing request details.
logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.jdbc: INFO
