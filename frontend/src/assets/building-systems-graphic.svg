    <path d="M566 175h20v16h-20zm4 5h12m-12 4h8m-8 4h10"/>
    <circle cx="99" cy="424" r="27" fill="#1B4140" stroke="#9BC1A7" stroke-width="1.5"/>
    <path d="M109 415a8 8 0 0 0-10 10l-7 7a3 3 0 0 0 4 4l7-7a8 8 0 0 0 10-10l-5 5-5-5z"/>
    <circle cx="562" cy="425" r="27" fill="#1B4140" stroke="#EAA16E" stroke-width="1.5"/>
    <path d="M562 411v28m7-21h-10a4 4 0 0 0 0 8h6a4 4 0 0 1 0 8h-10"/>
  </g>
</svg>
